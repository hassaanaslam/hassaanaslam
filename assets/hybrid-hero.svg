<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="455" viewBox="0 0 1280 455" role="img" aria-labelledby="title desc">
  <title id="title">Hassaan Aslam — Senior Software Engineer, Product Builder and Founder</title>
  <desc id="desc">A premium dark blue technical banner showing product engineering capabilities connected to measurable outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".48" stop-color="#0b2855"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="50%"><stop stop-color="#2563eb" stop-opacity=".38"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <filter id="neon"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="455" rx="28" fill="url(#bg)"/><rect width="1280" height="455" rx="28" fill="url(#glow)"/><rect width="1280" height="455" rx="28" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="66" y="72" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="4">ENGINEER  •  PRODUCT BUILDER  •  TECHNICAL LEADER  •  FOUNDER</text>
    <text x="63" y="151" fill="#fff" font-size="62" font-weight="850">Hassaan Aslam</text>
    <text x="67" y="194" fill="#dbeafe" font-size="23">Building reliable products across</text>
    <text x="68" y="225" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">WEB • MOBILE • BACKEND • CLOUD • DATA • AI</text>
    <g transform="translate(67 258)" filter="url(#shadow)">
      <rect width="600" height="78" rx="15" fill="#020617" fill-opacity=".82" stroke="#22d3ee" stroke-opacity=".45"/>
      <circle cx="27" cy="25" r="5" fill="#fb7185"/><circle cx="45" cy="25" r="5" fill="#fbbf24"/><circle cx="63" cy="25" r="5" fill="#4ade80"/>
      <text x="27" y="56" fill="#94a3b8" font-size="14" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">$</text>
      <text x="47" y="56" fill="#67e8f9" font-size="16" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">solve(problem) → ship(product) → measure(outcome)</text>
    </g>
    <text x="67" y="388" fill="#94a3b8" font-size="16">Senior Software Engineer  ·  Founder @ Appsynth  ·  US-hours collaboration</text>
    <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".8" filter="url(#neon)">
      <path d="M830 226L945 112M830 226L978 226M830 226L945 342M978 226L1115 125M978 226L1115 326"/>
    </g>
    <g text-anchor="middle" font-weight="700">
      <g><circle cx="830" cy="226" r="64" fill="#07111f" stroke="#22d3ee" stroke-width="2"/><text x="830" y="220" fill="#fff" font-size="16">MEASURABLE</text><text x="830" y="242" fill="#67e8f9" font-size="13">OUTCOME</text></g>
      <g><circle cx="945" cy="112" r="45" fill="#0f172a" stroke="#38bdf8"/><text x="945" y="117" fill="#e0f2fe" font-size="14">WEB</text></g>
      <g><circle cx="978" cy="226" r="45" fill="#0f172a" stroke="#60a5fa"/><text x="978" y="231" fill="#dbeafe" font-size="14">MOBILE</text></g>
      <g><circle cx="945" cy="342" r="45" fill="#0f172a" stroke="#818cf8"/><text x="945" y="347" fill="#e0e7ff" font-size="13">PLATFORM</text></g>
      <g><circle cx="1115" cy="125" r="45" fill="#0f172a" stroke="#a78bfa"/><text x="1115" y="130" fill="#ede9fe" font-size="14">CLOUD</text></g>
      <g><circle cx="1115" cy="326" r="45" fill="#0f172a" stroke="#e879f9"/><text x="1115" y="322" fill="#fae8ff" font-size="13">DATA</text><text x="1115" y="339" fill="#f5d0fe" font-size="11">+ AI</text></g>
    </g>
  </g>
</svg>
